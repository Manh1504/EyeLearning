services:
  ai:
    build:
      context: .
      args:
        # Mặc định build bản CPU-only (chạy được mọi máy, không cần GPU).
        # Máy có GPU NVIDIA + nvidia-container-toolkit: build lại với
        #   TORCH_VARIANT=cuda DEVICE=cuda docker compose up -d --build
        # và bỏ comment khối deploy.resources.reservations.devices bên dưới.
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    container_name: eyelearn_ai
    ports:
      - "9000:9000"
    environment:
      DEVICE: ${DEVICE:-cpu}
      # PHẢI trùng với TRACKING_TOKEN_SECRET của service "web" (docker-compose.yml
      # ở gốc project) — dùng để ký/xác thực tracking token giữa 2 service.
      TRACKING_TOKEN_SECRET: ${TRACKING_TOKEN_SECRET:-dev-tracking-token-secret}
      # Origin được phép mở WebSocket /inference tới service này.
      # (Server cũng tự cho phép mọi origin localhost/127.0.0.1 khi biến
      # AI_ALLOW_LOCALHOST_ORIGINS=true — mặc định true.)
      AI_WS_ORIGINS: ${AI_WS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:9080,http://127.0.0.1:9080}
    volumes:
      # Bắt buộc — model weights không nằm trong git/image, xem README.md ở gốc project.
      - ./weights:/app/weights
    # GPU — chỉ bỏ comment khi build/chạy với TORCH_VARIANT=cuda DEVICE=cuda:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - eyelearning_default

networks:
  eyelearning_default:
    name: eyelearning_default
    external: true