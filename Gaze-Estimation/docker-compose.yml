services:
  gaze-server:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: eyetracking-image:cpu
    container_name: eyetracking-container
    ports:
      - "9000:8000"
    volumes:
      - ./weights:/app/weights          # persist model calibration
    environment:
      face_detector: yolo
      face_detector_weight: weights/yolov8n-face.pt
      gaze_estimator: unigaze
      gaze_estimator_weight: weights/unigaze_l16_joint.safetensors
      calibrator: svr
      device: cpu
      size: "224"
    restart: unless-stopped 
