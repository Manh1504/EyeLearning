# ============================================================
# GazeEdu — Docker Compose (triển khai server trường)
# ------------------------------------------------------------
# Frontend đã deploy riêng trên Vercel. Server này chỉ chạy:
#   postgres + backend + gaze-api, đứng sau 1 nginx reverse proxy
#   (SSL, chỉ mở 80/443):
#   https://api.eyelearning.id.vn    -> backend  (FastAPI :8001)
#   https://gaze.eyelearning.id.vn   -> gaze-api (ML :8000, GPU)
#
# Frontend (Vercel) gọi trực tiếp 2 subdomain trên. Cần set trong
# Vercel project env:
#   NEXT_PUBLIC_API_URL=https://api.eyelearning.id.vn
#   NEXT_PUBLIC_GAZE_URL=https://gaze.eyelearning.id.vn
#
# Các service nội bộ giao tiếp qua docker network (tên service):
#   backend -> http://gaze:8000  (AI_HTTP_URL)
#
# Chứng chỉ SSL + trọng số gaze nằm NGOÀI git (bí mật / file lớn) -> mount từ
# đường dẫn tuyệt đối trên server: /opt/eyelearning/certs và /opt/eyelearning/weights.
# Tạo 1 lần trên server (certbot / scp), không bị xoá khi redeploy clone mới.
# ============================================================

services:
  postgres:
    image: postgres:16
    container_name: eyetracking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "5435:5432"   # chỉ để tool ngoài truy cập; app dùng service name `postgres:5432`
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: eyetracking-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Trong docker: dùng tên service cho nội bộ (không dùng localhost).
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      AI_HTTP_URL: http://gaze:8000
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GAZE_DOWNSAMPLE_HZ: ${GAZE_DOWNSAMPLE_HZ:-4.0}
      GAZE_BATCH_MAX: ${GAZE_BATCH_MAX:-2000}
      DEBUG: ${DEBUG:-false}
    volumes:
      - backend-media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ai/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Không publish 8001 ra host — chỉ nginx truy cập nội bộ.

  gaze:
    image: hieunm1501/gaze-api:gpu
    container_name: eyetracking-gaze
    restart: unless-stopped
    environment:
      - DEVICE=cuda
    volumes:
      # Trọng số model nằm ngoài git (gitignore + dung lượng lớn) -> mount từ
      # đường dẫn tuyệt đối ổn định trên server, không phụ thuộc thư mục clone.
      - /opt/eyelearning/weights:/app/weights
    gpus: all
    # Không publish 8000 ra host — chỉ nginx (và backend nội bộ) truy cập.

  nginx:
    image: nginx:1.27-alpine
    container_name: eyetracking-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - gaze
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Cert + webroot ACME nằm ngoài git -> đường dẫn tuyệt đối ổn định trên
      # server (tạo 1 lần bằng certbot, không bị xoá khi redeploy clone mới).
      - /opt/eyelearning/certs:/etc/nginx/certs:ro
      - /opt/eyelearning/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  backend-media:
