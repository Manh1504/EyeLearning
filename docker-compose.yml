services:
  postgres:
    image: postgres:16
    container_name: eyetracking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eyetracking
      TZ: UTC
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eyetracking"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: eyetracking-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eyetracking
      AI_HTTP_URL: http://api:8000
      AI_WS_URL: ws://api:8000/infer
      JWT_SECRET: dev-secret-change-me-please-0123456789abcdef
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8001:8001"

volumes:
  pgdata: