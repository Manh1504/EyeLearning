x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eyetracking-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "127.0.0.1:5435:5432"   # prod: chỉ tool trên host truy cập; app dùng service name `postgres:5432`
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chạy migration một lần mỗi lần deploy (idempotent) — thay cho bind mount
  # ./db/migrations (không hoạt động khi Portainer deploy từ Git/web-editor).
  # Có `build` để `docker compose up --build` luôn dùng migrations local (008, ...),
  # còn khi deploy qua GHCR thì image đã được CI build/push sẵn.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    image: ghcr.io/manh1504/eyelearning-migrations:latest
    container_name: eyetracking-migrate
    pull_policy: always
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}

  redis:
    image: redis:7-alpine
    container_name: eyetracking-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    # Không publish ra host — chỉ backend dùng nội bộ qua redis:6379 (tránh conflict 6379 trên host)
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/manh1504/eyelearning-backend:latest
    container_name: eyetracking-backend
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_URL: ${REDIS_URL_DOCKER}
      AI_HTTP_URL: http://gaze:8000
      CHATBOT_URL: http://chatbot:8000
      CHATBOT_TIMEOUT_SECONDS: ${CHATBOT_TIMEOUT_SECONDS:-60}
      CHATBOT_INGEST_TIMEOUT_SECONDS: ${CHATBOT_INGEST_TIMEOUT_SECONDS:-600}
      CHATBOT_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      # Frontend production phục vụ cả apex và www; proxy giữ nguyên Origin.
      CORS_ORIGINS: ${CORS_ORIGINS},https://www.eyelearning.id.vn
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      GAZE_DOWNSAMPLE_HZ: ${GAZE_DOWNSAMPLE_HZ:-4.0}
      GAZE_BATCH_MAX: ${GAZE_BATCH_MAX:-2000}
      # Dải mạng proxy tin cậy: chỉ peer trong dải này mới được tin X-Forwarded-For
      # (nginx trong mạng docker nội bộ). Xem nginx/default.conf set_real_ip_from.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      DEBUG: ${DEBUG:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    volumes:
      - backend-media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Không publish 8001 ra host — chỉ nginx truy cập nội bộ.

  chatbot:
    build:
      context: ./services/chatbot
      dockerfile: Dockerfile
    image: ghcr.io/manh1504/eyelearning-chatbot:latest
    container_name: eyetracking-chatbot
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${CHATBOT_DATABASE_URL_DOCKER}
      CHATBOT_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN}
      LLM_NAME: ${LLM_NAME:-gemini}
      EMBEDDING_NAME: ${EMBEDDING_NAME:-api}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-4096}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:8b-ctx16k}
      OLLAMA_API_URL: ${OLLAMA_API_URL}
      OLLAMA_SECKEY: ${OLLAMA_SECKEY}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen3.5:9b}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-qwen3-vl:8b-instruct}
      VLM_NAME: ${VLM_NAME:-local}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_MEDIA_DIR: /app/media
      STORAGE_HTTP_ALLOWED_HOSTS: ${STORAGE_HTTP_ALLOWED_HOSTS:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.3}
    volumes:
      - backend-media:/app/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gaze:
    image: ghcr.io/manh1504/eyelearning-gaze:latest
    container_name: eyetracking-gaze
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DEVICE=cuda
    volumes:
      - gaze-weights:/app/weights
    gpus: all
    # Healthcheck gọi /health của services/gaze/server.py (python có sẵn trong image,
    # không dùng curl). start_period dài vì entrypoint tải weights + load
    # mediapipe/unigaze lúc khởi động (có thể > 3 phút).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    # Không publish 8000 ra host — chỉ nginx (và backend nội bộ) truy cập.
    # Build từ ./services/gaze/Dockerfile, weights tải runtime vào volume (xem services/gaze/download_weights.py)

  frontend:
    image: ghcr.io/manh1504/eyelearning-frontend:latest
    container_name: eyetracking-frontend
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    # Không publish 3000 ra host — chỉ nginx truy cập nội bộ.
    # Next.js standalone (node server.js); rewrites server-side trỏ
    # /api,/media -> backend và /gaze -> gaze qua tên service docker.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: ghcr.io/manh1504/eyelearning-nginx:latest
    container_name: eyetracking-nginx
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      # CỐ Ý service_started (KHÔNG dùng service_healthy): gaze lỗi/calibration
      # chậm không được chặn nginx/backend — gaze chỉ ảnh hưởng tính năng AI.
      gaze:
        condition: service_started
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eyetracking-cloudflared
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - nginx
    # Token truyền qua biến môi trường (không lộ trong `docker inspect` /
    # command line / ps) thay vì tham số --token.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "run"]

volumes:
  pgdata:
  backend-media:
  gaze-weights:
  redis-data:
