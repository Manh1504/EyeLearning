services:
  postgres:
    image: postgres:16
    container_name: eyetracking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "127.0.0.1:5435:5432"   # prod: chỉ tool trên host truy cập; app dùng service name `postgres:5432`
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/manh1504/eyelearning-backend:latest
    container_name: eyetracking-backend
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      AI_HTTP_URL: http://gaze:8000
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GAZE_DOWNSAMPLE_HZ: ${GAZE_DOWNSAMPLE_HZ:-4.0}
      GAZE_BATCH_MAX: ${GAZE_BATCH_MAX:-2000}
      DEBUG: ${DEBUG:-false}
    volumes:
      - backend-media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ai/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Không publish 8001 ra host — chỉ nginx truy cập nội bộ.

  gaze:
    image: hieunm1501/gaze-api:gpu
    container_name: eyetracking-gaze
    pull_policy: always
    restart: unless-stopped
    environment:
      - DEVICE=cuda
    volumes:
      - gaze-weights:/app/weights
    gpus: all
    # Không publish 8000 ra host — chỉ nginx (và backend nội bộ) truy cập.

  nginx:
    image: ghcr.io/manh1504/eyelearning-nginx:latest
    container_name: eyetracking-nginx
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      gaze:
        condition: service_started
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eyetracking-cloudflared
    restart: unless-stopped
    depends_on:
      - nginx
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]

volumes:
  pgdata:
  backend-media:
  gaze-weights:
