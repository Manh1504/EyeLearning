services:
  web:
    build: ./web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://eyelearn_user:eyelearn_password@eyelearn_postgres:5432/eyelearn
    volumes:
      - ./web:/app/web
    networks:
      - eyelearning_default

networks:
  eyelearning_default:
    external: true
