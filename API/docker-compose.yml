services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Đổi thành https://download.pytorch.org/whl/cu126 nếu build cho GPU (1/2 - GPU)
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
    image: eyetracking-api:latest
    container_name: eyetracking-api
    restart: unless-stopped
    environment:
      # Phải khớp TORCH_INDEX_URL lúc build ở trên. Đổi thành "cuda" nếu build GPU (2/2 - GPU)
      DEVICE: cuda
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "9000:9000"
    volumes:
      - ./weights:/app/weights:ro
    # Bỏ comment khối dưới nếu máy có NVIDIA GPU + đã cài nvidia-container-toolkit:
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: all
               capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/docs"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3