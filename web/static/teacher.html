<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EyeLearn · Teacher Dashboard</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">EyeLearn</div>
    <div class="topbar-title">
      <strong>Teacher Dashboard</strong>
      <span>Lesson sessions and learning analytics</span>
    </div>
    <nav class="role-nav" aria-label="Teacher navigation">
      <a href="/teacher">Dashboard</a>
      <a href="#sessions">Sessions</a>
      <a href="/analytics">Analytics</a>
    </nav>
  </header>

  <main class="page dashboard-shell">
    <section class="panel dashboard-header">
      <div>
        <h1>Teacher Dashboard</h1>
        <p class="muted">Review learner sessions for a lesson and open analytics.</p>
      </div>
      <div class="field compact-field">
        <label for="lessonSelect">Lesson</label>
        <select id="lessonSelect">
          <option value="L001" selected>L001</option>
        </select>
      </div>
    </section>

    <section class="panel" id="sessions">
      <div class="section-header">
        <div>
          <h2>Sessions</h2>
          <p class="muted" id="teacherSessionSummary">Loading sessions...</p>
        </div>
        <button class="btn" type="button" id="refreshTeacherBtn">Refresh</button>
      </div>
      <div class="session-card-grid" id="teacherSessionsList"></div>
      <div id="teacherStatus" class="status-line"></div>
    </section>
  </main>

  <script type="module" src="/static/js/teacher_dashboard.js"></script>
</body>
</html>
