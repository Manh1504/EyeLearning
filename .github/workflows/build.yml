name: Build & Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

# Tránh nhiều run build chồng nhau cùng push image `latest` và gọi webhook
# Portainer. cancel-in-progress: FALSE — KHÔNG huỷ run đang chạy: nếu đã push
# một phần image hoặc đã gọi webhook thì huỷ giữa chừng sẽ để lại trạng thái
# deploy nửa vời (image lệch nhau, webhook gọi dở). Thay vào đó xếp hàng chờ.
concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_images: ${{ steps.plan.outputs.has_images }}
      deploy: ${{ steps.plan.outputs.deploy }}
      source_sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
    steps:
      - id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - id: previous
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build.yml",
              branch: "main",
              status: "completed",
              per_page: 100,
            });
            const previous = data.workflow_runs.find((run) =>
              run.event === "workflow_run" &&
              run.conclusion === "success" &&
              run.head_sha !== context.payload.workflow_run.head_sha
            );
            core.setOutput("sha", previous?.head_sha ?? "");

      - id: fallback
        if: github.event_name == 'workflow_run' && steps.previous.outputs.sha == ''
        shell: bash
        env:
          HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: echo "sha=$(git rev-parse "$HEAD_SHA^")" >> "$GITHUB_OUTPUT"

      - id: filter
        if: github.event_name == 'workflow_run'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.previous.outputs.sha || steps.fallback.outputs.sha }}
          ref: ${{ steps.source.outputs.sha }}
          filters: |
            # base: image nền dùng chung (torch cu124) — đổi base phải build lại
            # base TRƯỚC, rồi build lại cả gaze + chatbot (xem bước plan).
            base:
              - 'docker/ai-base/**'
              - '.github/workflows/build.yml'
            backend:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/requirements.txt'
              - 'backend/app/**'
              - '.github/workflows/build.yml'
            chatbot:
              - 'services/chatbot/**'
              - '.github/workflows/build.yml'
            gaze:
              - 'services/gaze/**'
              - '.github/workflows/build.yml'
            nginx:
              - 'nginx/Dockerfile'
              - 'nginx/default.conf'
              - '.github/workflows/build.yml'
            frontend:
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/next.config.ts'
              - 'frontend/app/**'
              - 'frontend/components/**'
              - 'frontend/lib/**'
              - 'frontend/hooks/**'
              - 'frontend/public/**'
              - '.github/workflows/build.yml'
            migrations:
              - 'Dockerfile.migrations'
              - 'db/migrations/**'
              - '.github/workflows/build.yml'
            deploy:
              - 'docker-compose.yml'

      - id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ steps.filter.outputs.base }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          CHATBOT: ${{ steps.filter.outputs.chatbot }}
          GAZE: ${{ steps.filter.outputs.gaze }}
          NGINX: ${{ steps.filter.outputs.nginx }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          MIGRATIONS: ${{ steps.filter.outputs.migrations }}
          DEPLOY: ${{ steps.filter.outputs.deploy }}
        run: |
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            BASE=true
            BACKEND=true
            CHATBOT=true
            GAZE=true
            NGINX=true
            FRONTEND=true
            MIGRATIONS=true
          fi

          # Đổi base (docker/ai-base/**) ⇒ phải build lại cả gaze + chatbot vì
          # chúng FROM base; nếu không, image service vẫn trỏ base cũ.
          if [[ "$BASE" == "true" ]]; then
            CHATBOT=true
            GAZE=true
          fi

          matrix='[]'
          if [[ "$BACKEND" == "true" ]]; then
            matrix=$(jq -c '. + [{"name":"backend","context":"./backend","file":"./backend/Dockerfile","build":true}]' <<< "$matrix")
          fi
          if [[ "$CHATBOT" == "true" ]]; then
            matrix=$(jq -c '. + [{"name":"chatbot","context":"./services/chatbot","file":"./services/chatbot/Dockerfile","build":true}]' <<< "$matrix")
          fi
          if [[ "$NGINX" == "true" ]]; then
            matrix=$(jq -c '. + [{"name":"nginx","context":"./nginx","file":"./nginx/Dockerfile","build":true}]' <<< "$matrix")
          fi
          if [[ "$FRONTEND" == "true" ]]; then
            matrix=$(jq -c '. + [{"name":"frontend","context":"./frontend","file":"./frontend/Dockerfile","build":true}]' <<< "$matrix")
          fi
          if [[ "$MIGRATIONS" == "true" ]]; then
            matrix=$(jq -c '. + [{"name":"migrations","context":".","file":"./Dockerfile.migrations","build":true}]' <<< "$matrix")
          fi
          if [[ "$GAZE" == "true" ]]; then
            matrix=$(jq -c '. + [{"name":"gaze","context":"./services/gaze","file":"./services/gaze/Dockerfile","build":true}]' <<< "$matrix")
          fi

          has_images=$(jq -r 'length > 0' <<< "$matrix")
          if [[ "$has_images" != "true" ]]; then
            matrix='[{"name":"noop","context":".","file":"./Dockerfile.migrations","build":false}]'
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_images=$has_images" >> "$GITHUB_OUTPUT"
          echo "deploy=${DEPLOY:-false}" >> "$GITHUB_OUTPUT"

  # Image nền dùng chung (docker/ai-base): torch/torchvision cu124. Build TRƯỚC
  # các image service vì gaze/chatbot `FROM ghcr.io/.../eyelearning-ai-base:latest`.
  # Cache gha scope=ai-base ⇒ khi base không đổi thì build gần như tức thời.
  build-base:
    name: Build ai-base
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_images == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/manh1504/eyelearning-ai-base
          tags: |
            type=raw,value=sha-${{ needs.changes.outputs.short_sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./docker/ai-base
          file: ./docker/ai-base/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-base
          cache-to: type=gha,scope=ai-base,mode=max

  build-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [changes, build-base]
    # Vẫn chạy khi base bị skip (chỉ deploy/docker-compose đổi). Dừng nếu base lỗi.
    if: ${{ always() && needs.build-base.result != 'failure' && needs.build-base.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.build
        with:
          ref: ${{ needs.changes.outputs.source_sha }}
      - uses: docker/setup-buildx-action@v3
        if: matrix.build
      - uses: docker/login-action@v3
        if: matrix.build
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: matrix.build
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/manh1504/eyelearning-${{ matrix.name }}
          tags: |
            type=raw,value=sha-${{ needs.changes.outputs.short_sha }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
      - uses: docker/build-push-action@v6
        if: matrix.build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: No image changes
        if: ${{ !matrix.build }}
        run: echo "No deployable image inputs changed."

  redeploy:
    name: Trigger Portainer webhook
    runs-on: ubuntu-latest
    needs: [changes, build-push]
    if: >-
      github.event_name == 'workflow_run' &&
      needs.build-push.result == 'success' &&
      (needs.changes.outputs.has_images == 'true' || needs.changes.outputs.deploy == 'true')
    steps:
      - name: Notify Portainer stack webhook (git pull + up -d)
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"

      # Smoke check công khai: xác nhận backend đã lên sau deploy. Dùng biến
      # repo vars.SMOKE_URL (vd https://api.eyelearning.id.vn/health) — KHÔNG
      # hardcode. Nếu chưa đặt biến → bỏ qua, không làm fail pipeline.
      # Lưu ý: gaze image lớn nên pull có thể mất vài phút → chờ tối đa
      # 20 × 15s = 300s (5 phút). Hạn chế: check có thể pass nhờ bản CŨ còn
      # chạy (xem đề xuất trả commit SHA trong /health).
      - name: Smoke check sau deploy
        if: ${{ vars.SMOKE_URL != '' }}
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          curl -fsS --retry 20 --retry-delay 15 --retry-connrefused \
            --max-time 10 "$SMOKE_URL"
          echo "Smoke check OK: $SMOKE_URL"
      - name: Bỏ qua smoke check (chưa đặt vars.SMOKE_URL)
        if: ${{ vars.SMOKE_URL == '' }}
        run: echo "vars.SMOKE_URL chưa đặt — bỏ qua smoke check (không fail pipeline)."

      # LƯU Ý: từ khi có service `ingest-bootstrap` trong docker-compose, việc
      # ingest lần đầu đã chạy tự động khi stack khởi động (chỉ khi chưa có
      # vector). Bước dưới đây là fallback TÙY CHỌN khi muốn trigger từ CI hoặc
      # muốn backfill lại slide lỗi/thiếu ngoài luồng bootstrap.
      # Cần:
      #   vars.CHATBOT_API_URL           = https://api.eyelearning.id.vn (hoặc URL nội bộ backend)
      #   secrets.CHATBOT_INTERNAL_TOKEN = cùng giá trị với stack
      # GitHub Actions KHÔNG cho dùng `secrets.*` trong `if:` (chỉ dùng được ở
      # `env:`/`with:`), nên điều kiện chỉ dựa vào vars.CHATBOT_API_URL.
      # Nếu chưa đặt vars → bỏ qua; lỗi backfill không chặn deploy (continue-on-error).
      - name: Backfill embedding (reindex-all)
        if: ${{ vars.CHATBOT_API_URL != '' }}
        continue-on-error: true
        env:
          CHATBOT_API_URL: ${{ vars.CHATBOT_API_URL }}
          CHATBOT_INTERNAL_TOKEN: ${{ secrets.CHATBOT_INTERNAL_TOKEN }}
        run: |
          if [ -z "${CHATBOT_INTERNAL_TOKEN}" ]; then
            echo "secrets.CHATBOT_INTERNAL_TOKEN chưa đặt — bỏ qua backfill."
            exit 0
          fi
          set -e
          endpoint="${CHATBOT_API_URL%/}/internal/embeddings/reindex-all"
          echo "Kích hoạt backfill (chạy nền) tại $endpoint"
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -X POST "$endpoint" \
            -H "X-Chatbot-Token: $CHATBOT_INTERNAL_TOKEN" \
            -H "Content-Type: application/json"
          echo "Đã kích hoạt. Theo dõi tiến độ qua /internal/embeddings/status."
      - name: Kiểm tra trạng thái embedding sau khi kích hoạt
        if: ${{ vars.CHATBOT_API_URL != '' }}
        continue-on-error: true
        env:
          CHATBOT_API_URL: ${{ vars.CHATBOT_API_URL }}
          CHATBOT_INTERNAL_TOKEN: ${{ secrets.CHATBOT_INTERNAL_TOKEN }}
        run: |
          if [ -z "${CHATBOT_INTERNAL_TOKEN}" ]; then
            echo "secrets.CHATBOT_INTERNAL_TOKEN chưa đặt — bỏ qua."
            exit 0
          fi
          endpoint="${CHATBOT_API_URL%/}/internal/embeddings/status"
          for i in 1 2 3 4 5; do
            echo "--- lần $i ---"
            curl -fsS --max-time 30 "$endpoint" \
              -H "X-Chatbot-Token: $CHATBOT_INTERNAL_TOKEN" || true
            echo
            sleep 30
          done
      - name: Bỏ qua backfill embedding (chưa đặt CHATBOT_API_URL)
        if: ${{ vars.CHATBOT_API_URL == '' }}
        run: echo "vars.CHATBOT_API_URL chưa đặt — bỏ qua backfill embedding (chạy tay sau)."
