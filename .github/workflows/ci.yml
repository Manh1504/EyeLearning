name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eyetracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eyetracking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/migrations/*.sql; do
            echo "=== $f ==="
            psql -h localhost -U postgres -d eyetracking_test -v ON_ERROR_STOP=1 -f "$f"
          done
      # Dockerfile.migrations chạy lại toàn bộ *.sql mỗi lần deploy; nếu một
      # file không idempotent thì backend không lên. Canh lỗi này ngay ở CI
      # bằng cách chạy lần hai (đã xác nhận idempotent, không nhân đôi dữ liệu).
      - name: Re-apply migrations (idempotency guard)
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/migrations/*.sql; do
            echo "=== rerun $f ==="
            psql -h localhost -U postgres -d eyetracking_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          TESTING: "1"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eyetracking_test
          JWT_SECRET: ci-test-secret
          CORS_ORIGINS: http://localhost:3000
          AI_HTTP_URL: http://localhost:8000
        run: python -m pytest tests -v

  frontend:
    name: Frontend checks + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  chatbot:
    name: Chatbot tests + image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/chatbot/requirements.docker.txt
            services/chatbot/requirements.test.txt
      - name: Install dependencies
        working-directory: services/chatbot
        run: pip install -r requirements.docker.txt -r requirements.test.txt
      - name: Unit tests
        working-directory: services/chatbot
        run: python -m pytest -q
      - name: Build image
        run: docker build -t eyelearning-chatbot:ci ./services/chatbot
