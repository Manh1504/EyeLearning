# Cấu hình ruff dùng chung cho Python trong repo (backend + services/*).
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "W"]
# E501: độ dài dòng do formatter quyết định; E402: vài module cố ý load_dotenv()
# trước khi import app.* (đảm bảo biến môi trường có sẵn lúc import).
ignore = ["E501", "E402"]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
"**/tests/**" = ["E731"]
