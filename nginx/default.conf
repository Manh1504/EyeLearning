# ============================================================
# nginx reverse proxy nội bộ — sau Cloudflare Tunnel (cloudflared)
# Cloudflare Edge lo TLS public, tunnel forward HTTP tới nginx:80
# theo Host gốc, nginx route tiếp:
# - api.eyelearning.id.vn  -> backend (FastAPI :8001)
# - gaze.eyelearning.id.vn -> gaze-api (:8000, HTTP + WebSocket)
# Không listen 443, không cert, không ACME challenge.
# ============================================================

# Endpoint Docker healthcheck.
server {
    listen 80 default_server;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Tunnel chỉ forward 2 Host dưới; Host lạ trả 444.
    location / {
        return 444;
    }
}

# Backend API
server {
    listen 80;
    server_name api.eyelearning.id.vn;

    client_max_body_size 100m;  # upload PDF slide (giới hạn backend 100MB, khớp limit 100MB của CF Free)

    location / {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Gaze API (HTTP + WebSocket stream /session/{sid}/stream)
server {
    listen 80;
    server_name gaze.eyelearning.id.vn;

    # Cho phép browser cross-origin (subdomain khác eyelearning.id.vn).
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://gaze:8000;
        proxy_http_version 1.1;
        # Bắt buộc cho WebSocket stream /session/{sid}/stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
