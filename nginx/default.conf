# ============================================================

log_format upstream_timing '$remote_addr - $request_id [$time_local] "$request" $status '
    'request_time=$request_time upstream_connect=$upstream_connect_time '
    'upstream_header=$upstream_header_time upstream_response=$upstream_response_time '
    'cf_ray=$http_cf_ray';
# nginx reverse proxy nội bộ — sau Cloudflare Tunnel (cloudflared)
# Cloudflare Edge lo TLS public, tunnel forward HTTP tới nginx:80
# theo Host gốc, nginx route tiếp:
# - api.eyelearning.id.vn  -> backend (FastAPI :8001)
# - gaze.eyelearning.id.vn -> gaze-api (:8000, HTTP + WebSocket)
# - app.eyelearning.id.vn  -> frontend Next.js (:3000) + /api,/media -> backend,
#                             /gaze -> gaze (thay Vercel, chạy song song)
# Không listen 443, không cert, không ACME challenge.
# ============================================================

# --- Real IP: lấy IP client thật từ Cloudflare ---
# cloudflared kết nối tới nginx từ mạng docker nội bộ, nên $remote_addr mặc
# định là IP của cloudflared (mọi user chung 1 giá trị). Cloudflare đặt header
# CF-Connecting-IP = IP client thật; realip module dùng nó để ghi lại
# $remote_addr. CHỈ tin CF-Connecting-IP khi peer nằm trong dải mạng docker
# nội bộ (cloudflared/nginx), không tin từ nguồn khác.
set_real_ip_from 172.16.0.0/12;   # dải docker bridge mặc định (RFC1918)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Endpoint Docker healthcheck.
server {
    listen 80 default_server;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Tunnel chỉ forward 2 Host dưới; Host lạ trả 444.
    location / {
        return 444;
    }
}

# Backend API
server {
    listen 80;
    server_name api.eyelearning.id.vn;
    access_log /var/log/nginx/api_access.log upstream_timing;

    # Mặc định nhỏ cho request thường (JSON gaze batch ~ vài trăm KB).
    # KHÔNG nới global — chỉ location upload PDF mới cho phép 100m.
    client_max_body_size 2m;

    # Security headers cho API (kể cả khi đi qua Cloudflare)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Upload PDF slide: giới hạn khớp backend (max_pdf_bytes = 50MB, xem
    # backend/app/core/config.py) và bằng giới hạn body của Cloudflare Free.
    # Render PDF đồng bộ ở backend nên cần read timeout dài; lưu ý Cloudflare
    # cắt request ~100s (lỗi 524) bất kể nginx đặt bao nhiêu.
    location ~ ^/teacher/lessons/[^/]+/slides/upload$ {
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GHI ĐÈ (không append $proxy_add_x_forwarded_for) để client không thể
        # giả mạo IP: backend chỉ tin header đến từ nginx (proxy tin cậy).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}

# ============================================================
# Frontend Next.js (thay Vercel, chạy song song apex/www cũ).
# Định tuyến TƯƠNG ĐƯƠNG rewrites của frontend/next.config.ts:
#   /api/teacher/*  -> backend /teacher/*      (BỎ tiền tố /api)
#   /api/admin/*    -> backend /admin/*        (BỎ tiền tố /api)
#   /api/*          -> backend /api/*          (giữ nguyên — auth/me/courses/...)
#   /media/*        -> backend /media/*        (giữ nguyên)
#   /gaze/*         -> gaze /*                 (BỎ tiền tố /gaze; WS)
#   /*              -> frontend:3000
# THỨ TỰ quan trọng: các regex cụ thể phải đứng trước location / .
# ============================================================
server {
    listen 80;
    server_name app.eyelearning.id.vn;

    # Upload PDF đi qua /api/teacher/... nên cần body lớn — đặt ở đây vì
    # request vào FE domain trước khi tới backend.
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- API: teacher/admin bỏ tiền tố /api (backend không có prefix này) ---
    # /api/teacher/lessons/... -> backend /teacher/lessons/...
    location /api/teacher/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Upload PDF slide nằm trong /api/teacher/lessons/{id}/slides/upload.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/admin/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- API còn lại: giữ nguyên /api/... ---
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Media (ảnh slide) ---
    location /media/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # --- Gaze (HTTP + WebSocket); bỏ tiền tố /gaze ---
    # /gaze/session/... -> gaze /session/...
    location /gaze/ {
        rewrite ^/gaze(/.*)$ $1 break;
        proxy_pass http://gaze:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # --- Còn lại: Next.js ---
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Gaze API (HTTP + WebSocket stream /session/{sid}/stream)
# Chỉ whitelist origin eyelearning.id.vn + localhost dev, tránh * .
map $http_origin $cors_allow_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*eyelearning\.id\.vn$" $http_origin;
    "~^http://localhost:3000$" $http_origin;
    "~^http://127\.0\.0\.1:3000$" $http_origin;
}

server {
    listen 80;
    server_name gaze.eyelearning.id.vn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS có điều kiện — chỉ khi origin hợp lệ mới trả header
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Vary "Origin" always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://gaze:8000;
        proxy_http_version 1.1;
        # Bắt buộc cho WebSocket stream /session/{sid}/stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi đè để không tin XFF do client gửi (xem block backend).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
