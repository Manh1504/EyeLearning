# ============================================================
# nginx reverse proxy — GazeEdu (SSL + reverse proxy)
# Frontend đã deploy riêng trên Vercel, nginx ở đây chỉ proxy:
# - api.eyelearning.id.vn    -> backend (FastAPI)
# - gaze.eyelearning.id.vn   -> gaze-api (HTTP + WebSocket)
#
# Chứng chỉ mount từ ./nginx/certs (fullchain.pem + privkey.pem).
# Lấy Let's Encrypt (certbot): xem ghi chú ở cuối file.
# ============================================================

# ---- HTTP: chuyển hướng sang HTTPS + thử thách ACME ----
server {
    listen 80;
    server_name api.eyelearning.id.vn gaze.eyelearning.id.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Backend API ----
server {
    listen 443 ssl;
    server_name api.eyelearning.id.vn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 100m;  # upload PDF slide (giới hạn backend 100MB)

    location / {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Gaze API (HTTP + WebSocket stream) ----
server {
    listen 443 ssl;
    server_name gaze.eyelearning.id.vn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Cho phép browser cross-origin (subdomain khác eyelearning.id.vn).
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://gaze:8000;
        proxy_http_version 1.1;
        # Bắt buộc cho WebSocket stream /session/{sid}/stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# ============================================================
# Lấy chứng chỉ Let's Encrypt (trên host, không trong container):
#   sudo apt install certbot
#   sudo certbot certonly --webroot -w /opt/eyelearning/certbot \
#       -d api.eyelearning.id.vn -d gaze.eyelearning.id.vn
#   (certbot ghi fullchain.pem + privkey.pem vào /opt/eyelearning/certs)
# Sau đó copy/link vào ./nginx/certs:
#   sudo cp /etc/letsencrypt/live/<domain>/fullchain.pem nginx/certs/
#   sudo cp /etc/letsencrypt/live/<domain>/privkey.pem   nginx/certs/
# Hoặc dùng profile certbot trong docker (tùy chọn).
# ============================================================
