# ============================================================
# nginx reverse proxy — GazeEdu (SSL + reverse proxy)
# Frontend deploy riêng trên Vercel, nginx ở đây chỉ proxy:
# - api.eyelearning.id.vn    -> backend (FastAPI)
# - gaze.eyelearning.id.vn   -> gaze-api (HTTP + WebSocket)
#
# Cert do container certbot sinh vào volume chung, đường dẫn cố định:
#   /etc/nginx/certs/live/eyelearning/fullchain.pem
#   /etc/nginx/certs/live/eyelearning/privkey.pem
# Nếu chưa có cert, entrypoint sinh self-signed tạm để nginx vẫn chạy.
# ============================================================

# ---- HTTP: ACME challenge + chuyển hướng HTTPS ----
server {
    listen 80;
    server_name api.eyelearning.id.vn gaze.eyelearning.id.vn;

    # Phục vụ thử thách ACME cho certbot (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Backend API ----
server {
    listen 443 ssl;
    server_name api.eyelearning.id.vn;

    ssl_certificate     /etc/nginx/certs/live/eyelearning/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/eyelearning/privkey.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Gaze API (HTTP + WebSocket stream) ----
server {
    listen 443 ssl;
    server_name gaze.eyelearning.id.vn;

    ssl_certificate     /etc/nginx/certs/live/eyelearning/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/eyelearning/privkey.pem;

    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://gaze:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
