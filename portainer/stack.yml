# ============================================================
# EyeLearning — Portainer Stack (image-based)
#
# Portainer Stacks KHÔNG chạy docker build và KHÔNG nên dùng bind-mount đường
# dẫn tương đối — stack này chỉ dùng image từ registry + named volumes, deploy
# được thẳng từ UI Portainer (Stacks -> Add stack -> dán file này).
#
# Biến môi trường khai báo trong UI Portainer lúc deploy:
#   DOCKER_USER           - username Docker Hub (vd. nguyenvana)
#   POSTGRES_PASSWORD     - password Postgres, tự sinh (vd. openssl rand -hex 24)
#   TRACKING_TOKEN_SECRET - secret ký tracking token, tự sinh (vd. openssl rand -hex 32)
#
# Images cần push trước (xem README.md ở gốc project — mục Deploy):
#   <DOCKER_USER>/eyelearn-web       - backend FastAPI, tự chạy migrations lúc khởi động
#   <DOCKER_USER>/eyelearn-frontend  - React + nginx, proxy API + AI cùng origin
#   <DOCKER_USER>/eyelearn-ai        - Gaze-Estimation, ĐÃ KÈM model weights (~1.7GB)
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eyelearn_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eyelearn
    volumes:
      - eyelearn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyelearn_user -d eyelearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eyelearn

  web:
    image: ${DOCKER_USER}/eyelearn-web:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://eyelearn_user:${POSTGRES_PASSWORD}@postgres:5432/eyelearn
      # Browser gọi AI qua nginx proxy /ai/ cùng origin (service frontend bên dưới) —
      # không cần biết IP server, tránh mixed-content khi chạy sau HTTPS.
      AI_HTTP_URL: /ai
      AI_WS_URL: /ai/inference
      # Server-side call từ web sang AI trong network nội bộ của stack.
      AI_BACKEND_HTTP_URL: http://ai:9000
      # PHẢI trùng giá trị ở service ai.
      TRACKING_TOKEN_SECRET: ${TRACKING_TOKEN_SECRET}
      ENABLE_DEV_TOOLS: "false"
      ENABLE_MOUSE_SIMULATION: "false"
      # Chỉ cần set khi browser gọi API khác origin (trang đặt sau proxy nơi khác).
      CORS_ORIGINS: ""
    volumes:
      - eyelearn_data:/app/data
    depends_on:
      - postgres
    # Image tự chạy migrations (web.migrate) và tự retry kết nối Postgres ~2 phút,
    # nên không phụ thuộc thứ tự khởi động giữa các container.
    networks:
      - eyelearn

  ai:
    image: ${DOCKER_USER}/eyelearn-ai:latest
    environment:
      DEVICE: cpu
      TRACKING_TOKEN_SECRET: ${TRACKING_TOKEN_SECRET}
      # WebSocket /inference đi qua nginx đã bị bỏ header Origin nên không phụ thuộc
      # danh sách này; chỉ cần khi browser gọi THẲNG port 9000 (stack không expose).
      AI_WS_ORIGINS: ""
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:9000/health_check', timeout=5)).get('pipeline_loaded') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - eyelearn

  frontend:
    image: ${DOCKER_USER}/eyelearn-frontend:latest
    ports:
      # Port DUY NHẤT expose ra ngoài — mọi thứ (kể cả AI WebSocket) đi qua đây.
      # Đổi vế trái nếu trường yêu cầu port khác (vd. "80:80").
      - "9080:80"
    environment:
      API_UPSTREAM: web:8000
      AI_UPSTREAM_AI: ai:9000
      # Để trống: browser gọi API cùng-origin qua nginx proxy (khuyến nghị).
      RUNTIME_API_BASE: ""
    depends_on:
      - web
      - ai
    networks:
      - eyelearn

networks:
  eyelearn:
    name: eyelearn

volumes:
  eyelearn_pgdata:
  eyelearn_data:
